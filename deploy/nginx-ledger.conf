# /etc/nginx/conf.d/ledger.conf: reverse proxy in front of gunicorn.
# install.sh fills in @SERVER_NAME@ (hostname or IP) and @UPSTREAM@
# (gunicorn's LEDGER_BIND address).
#
# SELinux: nginx may only connect to gunicorn's port after you run
#   setsebool -P httpd_can_network_connect 1
# (install.sh runs this for you).

upstream ledger_app {
    server @UPSTREAM@;
}

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;

    client_max_body_size 1m;

    # The app has no login of its own, so nginx asks for a password.
    # Manage users with:  sudo htpasswd -B /etc/nginx/ledger.htpasswd <username>
    auth_basic           "Ledger";
    auth_basic_user_file /etc/nginx/ledger.htpasswd;

    location / {
        proxy_pass http://ledger_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
