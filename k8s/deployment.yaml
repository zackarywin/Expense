apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  labels:
    app: ledger
spec:
  # SQLite = one writer. Do not scale this above 1.
  replicas: 1
  # Recreate (not RollingUpdate) so the old pod releases the RWO volume
  # before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      # Only needed if the ghcr.io package is private:
      #   kubectl -n ledger create secret docker-registry ghcr-pull \
      #     --docker-server=ghcr.io --docker-username=<github-user> \
      #     --docker-password=<PAT with read:packages>
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger
          image: registry.example.com/ledger:0.1.0   # <- change me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: EXPENSE_TRACKER_DATA_DIR
              value: /data
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp            # gunicorn worker heartbeat files
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ledger-data
        - name: tmp
          emptyDir: {}
